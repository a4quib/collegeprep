<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CollegePrep Programme</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://unpkg.com/lucide@0.244.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="aurora-bg"></div>

  <nav class="glass-panel main-nav">
    <div class="logo">CollegePrep.</div>
    <div class="nav-links">
      <a href="#network">Network</a>
      <a href="#team">Team</a>
      <a href="#sessions">Sessions</a>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">
        <span class="text-rewind" data-strings='["CollegePrep Programme","Global Student Network"]'></span>
      </h1>
      <p class="hero-subtitle">Connecting students, mentors, and opportunities worldwide.</p>

      <div class="cta-group">
        <a href="#network" class="btn btn-primary">Explore Network</a>
        <a href="#team" class="btn btn-secondary glass-panel">Meet the Team</a>
      </div>
    </div>

    <div class="hero-decor">
      <div class="aurora aurora-1"></div>
      <div class="aurora aurora-2"></div>
      <div class="floating-blobs"></div>
    </div>
  </header>

  <section id="network" class="globe-section">
    <div class="globe-ui">
      <div class="search-container glass-panel">
        <input type="text" id="studentSearch" placeholder="Search by name, location, or year...">
        <ul id="searchResults" class="search-results hidden"></ul>
      </div>
    </div>
    
    <div id="globeViz"></div>

    <div id="student-card" class="student-card glass-panel hidden">
      <button class="close-card" onclick="closeStudentCard()">×</button>
      <img id="card-img" src="" alt="Student">
      <h3 id="card-name"></h3>
      <p id="card-profession" class="accent-text"></p>
      <p id="card-company"></p>
      <div class="card-meta">
        <span id="card-location"></span> • <span id="card-year"></span>
      </div>
    </div>
  </section>

  <section id="team" class="content-section">
    <h2 class="section-title"><span class="text-rewind" data-strings='["Meet the Team"]'></span></h2>
    <div class="grid-container" id="team-grid"></div>
  </section>

  <section id="sessions" class="content-section">
    <h2 class="section-title"><span class="text-rewind" data-strings='["Session Recordings","Recent Sessions"]'></span></h2>
    <div class="grid-container" id="sessions-grid"></div>
  </section>

  <footer class="glass-panel minimal-footer">
    <p>&copy; 2026 CollegePrep Programme. Designed for excellence.</p>
  </footer>

  <script src="textrewind.js"></script>
  <script>
    // Init TextRewind instances after page load
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.text-rewind').forEach(el => new TextRewind(el, {
        interval: 40,
        pause: 1600,
        shadowColors: {
          first: "#F5BC18",
          second: "#D69F00",
          third: "#4F279A",
          fourth: "#36107A",
          glow: "#F5BC18"
        }
      }));
      if (window.lucide) window.lucide.createIcons();
    });
  </script>

  <script src="script.js"></script>
</body>
</html>
